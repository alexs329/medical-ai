const modules072=[["Лапароскопия: оборудование и визуализация", "Laparoscopy: equipment and visualization", "Что изучает студент\nЛапароскопия — эндоскопический метод исследования и хирургического доступа к брюшной полости. В отличие от открытой хирургии, оператор наблюдает поле на мониторе. Важно различать диагностическую и лечебную лапароскопию: первая направлена на уточнение состояния органов, вторая является способом выполнения вмешательства. Малоинвазивность не означает отсутствие риска.\n\nОборудование\nВидеосистема состоит из оптики, камеры, источника света и монитора. Троакарная канюля образует рабочий канал. Инсуффлятор контролирует газовую среду, а отдельные инструменты обеспечивают захват, разделение тканей, аспирацию и наложение швов. У оборудования различное назначение: например, оптический прибор не является инструментом для рассечения.\n\nПространственное мышление\nДвижение рукоятки и рабочего конца инструмента может восприниматься противоположно из-за точки опоры у входа в тело. На плоском мониторе глубину оценивают косвенно — по взаимному перекрытию структур, перспективе и движению. Этим объясняется необходимость тренировки координации зрения и рук.\n\nОграничения и безопасность\nКачество изображения, анатомические вариации, спайки и ограниченное пространство влияют на возможность распознавать структуры. Термические, механические и связанные с газовой средой осложнения рассматривают отдельно. Невозможность уверенно идентифицировать анатомию — повод обсуждать ситуацию с ответственным хирургом, а не угадывать.\n\nОптическая система и пространственное восприятие\nЛапароскопическая система превращает трёхмерную область операции в изображение на мониторе. Оптическая ось, поле зрения и положение камеры определяют, какие структуры видны. Прямая оптика смотрит вдоль оси прибора; угловая позволяет менять направление обзора. Освещение, баланс белого, загрязнение объектива и отражение света от влажных поверхностей влияют на качество изображения. Двумерный монитор ограничивает оценку глубины: студенту полезно отдельно изучать монокулярные признаки расстояния, перекрытие объектов и изменение их относительных размеров. Трёхмерная видеосистема может передавать стереоскопическую информацию, но не отменяет знания анатомии.\n\nМеханика инструмента\nДлинный стержень передаёт движение рукоятки к рабочим браншам. В отличие от открытой хирургии, движение вокруг точки опоры может приводить к противоположному смещению рабочего конца. Подвижные соединения, сопротивление ткани и ограниченная тактильная обратная связь усложняют оценку нагрузки. Граспер, диссектор, ножницы и иглодержатель различаются не только внешним видом, но и профилем рабочих поверхностей. Классифицировать их следует по функции, а не по цвету рукоятки.\n\nГазовая среда и физиология\nПневмоперитонеум создаёт рабочее пространство, но одновременно изменяет условия кровообращения и дыхания. Углекислый газ способен всасываться через брюшину и влиять на кислотно-основное состояние. Повышение внутрибрюшного давления изменяет положение диафрагмы и механические свойства дыхательной системы. Эти эффекты зависят от состояния пациента, длительности вмешательства и других факторов. Для изучения темы необходимо связывать анатомию брюшной полости с физиологией вентиляции, венозного возврата и газообмена. Управление параметрами относится к профессиональной работе хирургической и анестезиологической команды.", "What to study\nLaparoscopy is an endoscopic approach to examining or operating in the abdominal cavity. Unlike open surgery, the operator sees the field on a monitor. Diagnostic laparoscopy investigates organ conditions; therapeutic laparoscopy is an operative approach. Minimally invasive does not mean risk-free.\n\nEquipment\nThe video system comprises optics, camera, light source and monitor. A trocar cannula provides a working channel. The insufflator regulates the gas environment; separate tools grasp, divide, aspirate and suture. Optical instruments do not cut tissue.\n\nSpatial reasoning\nThe fulcrum at the access point can make handle and tip movement appear reversed. On a flat screen, depth is inferred from overlap, perspective and motion. This explains the need for visuomotor coordination training.\n\nLimitations and safety\nImage quality, anatomical variation, adhesions and limited space affect recognition of structures. Thermal, mechanical and gas-related complications are distinct. Uncertain anatomy requires discussion with the supervising surgeon, not guessing.\n\nOptics and spatial perception\nA laparoscopic imaging system presents a three-dimensional operative field on a monitor. Optical axis, field of view and camera position determine visibility. Straight optics view along the axis; angled optics change viewing direction. Lighting, white balance, contamination and reflections influence image quality. A two-dimensional display limits depth cues; students should study occlusion, relative size and motion. Stereo imaging can provide binocular cues but does not replace anatomy knowledge.\n\nInstrument mechanics\nA long shaft transmits handle motion to the jaws. Motion about the access point may reverse tip displacement compared with open surgery. Joints, tissue resistance and reduced tactile feedback complicate force perception. Graspers, dissectors, scissors and needle holders differ in working surfaces as well as appearance. Classify them by function rather than handle colour.\n\nGas environment and physiology\nPneumoperitoneum creates workspace but changes circulatory and respiratory conditions. Carbon dioxide can be absorbed across the peritoneum and influence acid–base balance. Increased intra-abdominal pressure changes diaphragm position and respiratory mechanics. Effects depend on patient condition, duration and other factors. Connect abdominal anatomy with ventilation, venous return and gas exchange. Management belongs to the trained surgical and anaesthetic team.", "Safety considerations in laparoscopic surgery (2022), PMC8788169 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Брюшина и брюшная полость", "Peritoneum and abdominal cavity", "Строение\nБрюшина — серозная оболочка, включающая париетальный и висцеральный листки. Париетальный листок связан со стенками живота, висцеральный покрывает органы. Полость брюшины является потенциальным пространством между ними, а не местом, внутри которого свободно лежат все органы.\n\nОтношение органов к брюшине\nЖелудок, селезёнка и большая часть тонкой кишки имеют интраперитонеальное положение. Почки находятся забрюшинно. Большая часть двенадцатиперстной кишки и поджелудочной железы вторично забрюшинны. Эти отношения важны при изучении топографической анатомии и распространения патологических процессов.\n\nСвязки, брыжейки, сальники\nБрыжейки — двойные листки брюшины, в которых проходят сосуды, нервы и лимфатические структуры. Большой сальник связан с большой кривизной желудка, малый — с печенью и малой кривизной желудка и начальной частью двенадцатиперстной кишки. Сальниковая сумка лежит позади желудка.\n\nКлинические связи\nВоспаление брюшины называется перитонитом. Раздражение париетальной брюшины может вызывать более локализованную боль, чем висцеральное раздражение. Распределение жидкости зависит от анатомии, положения тела и характера процесса. Ни один отдельный симптом не заменяет клиническое обследование.\n\nБрыжейка и сосудистые пути\nБрыжейка представляет собой дупликатуру брюшины, в которой проходят сосуды, нервы и лимфатические структуры. Она не только фиксирует орган, но и позволяет ему сохранять определённую подвижность. Корень брыжейки образует область прикрепления к задней стенке живота. Сосудистые ветви располагаются между листками; поэтому анатомию кишечника необходимо изучать вместе с его кровоснабжением и лимфооттоком. Большой сальник связан с желудком и свисает кпереди от кишечных петель; малый сальник соединяет печень с желудком и проксимальной двенадцатиперстной кишкой.\n\nТопографические отношения\nБрюшная полость не является пустой камерой: поверхности органов контактируют друг с другом, а положение зависит от наполнения, дыхания и индивидуального строения. Почки и большая часть поджелудочной железы располагаются забрюшинно. Часть органов имеет собственную брыжейку, другие вторично фиксированы к задней стенке. Важно отличать полость брюшины от всей брюшной полости. На рисунке передняя поверхность органа не всегда соответствует виду при операции или на томограмме. Ориентацию следует сверять с обозначениями плоскостей и соседними структурами.", "Structure\nThe peritoneum is a serous membrane with parietal and visceral layers. The parietal layer lines abdominal walls; the visceral layer covers organs. Its cavity is a potential space, not a container in which all organs lie freely.\n\nPeritoneal relations\nThe stomach, spleen and most small intestine are intraperitoneal. Kidneys are retroperitoneal. Most of the duodenum and pancreas are secondarily retroperitoneal. These relationships matter in topographic anatomy and disease spread.\n\nLigaments, mesenteries, omenta\nMesenteries are double folds containing vessels, nerves and lymphatic structures. The greater omentum is associated with the greater gastric curvature; the lesser omentum connects liver to the lesser curvature and proximal duodenum. The lesser sac lies behind the stomach.\n\nClinical links\nInflammation of the peritoneum is peritonitis. Parietal irritation may cause more localized pain than visceral irritation. Fluid distribution depends on anatomy, body position and disease. No isolated symptom substitutes for assessment.\n\nMesentery and vascular pathways\nThe mesentery is a double layer of peritoneum carrying vessels, nerves and lymphatic structures. It anchors organs while allowing mobility. Its root attaches to the posterior abdominal wall. Vascular branches lie between its layers; study intestinal anatomy together with blood supply and lymph drainage. The greater omentum is associated with the stomach and hangs anterior to bowel loops; the lesser omentum connects the liver with the stomach and proximal duodenum.\n\nTopographical relationships\nThe abdomen is not an empty chamber: organs contact one another and position varies with filling, respiration and individual anatomy. Kidneys and most of the pancreas are retroperitoneal. Some organs have a mesentery; others are secondarily fixed posteriorly. Distinguish the peritoneal cavity from the entire abdominal cavity. An anterior atlas view is not necessarily the operative or tomographic view. Check planes and neighbouring structures.", "OpenStax Anatomy and Physiology 2e, §23.1 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Гемостаз и свёртывание крови", "Hemostasis and coagulation", "Первичный гемостаз\nПри повреждении сосудистой стенки возникает местная сосудистая реакция. Тромбоциты взаимодействуют с компонентами повреждённой поверхности, активируются и агрегируют. Фактор фон Виллебранда играет важную роль в адгезии тромбоцитов. Нарушения числа или функции тромбоцитов могут препятствовать формированию первичной пробки.\n\nВторичный гемостаз\nВ системе коагуляции последовательные взаимодействия факторов приводят к образованию тромбина, который превращает фибриноген в фибрин. Фибриновая сеть укрепляет тромбоцитарную пробку. После восстановления тканей регулируемый фибринолиз способствует удалению фибрина.\n\nЛабораторная оценка\nЧисло тромбоцитов характеризует количество, но не полностью отражает функцию. Протромбиновое время и АЧТВ оценивают разные компоненты плазменного свёртывания. Результаты зависят от метода исследования, лекарств и клинического состояния. Нормальные показатели не исключают все причины кровоточивости.\n\nХирургическое значение\nКровопотеря может быть наружной или внутренней. Механическое повреждение сосуда и системное нарушение гемостаза — разные причины, которые могут сочетаться. Принципы хирургического гемостаза включают механические и энергетические способы; практический выбор относится к компетенции операционной команды.\n\nТромбоциты и первичный гемостаз\nПри повреждении сосудистой стенки обнажение субэндотелиальных структур способствует адгезии тромбоцитов. Фактор фон Виллебранда участвует в связывании тромбоцитов с повреждённой поверхностью. Активированные тромбоциты меняют форму, выделяют медиаторы и формируют агрегат; фибриноген связывает активированные рецепторы соседних клеток. Первичная пробка сама по себе не равнозначна стабильному фибриновому сгустку. В учебной задаче следует различать количество тромбоцитов и их функциональную активность.\n\nФибринолиз и лабораторные показатели\nПлазмин образуется из плазминогена и расщепляет фибрин. Регуляция этого процесса ограничивает накопление сгустка и участвует в его удалении. Протромбиновое время и АЧТВ отражают разные группы плазменных факторов в условиях лабораторного теста, но не измеряют все звенья гемостаза. Количество тромбоцитов не показывает их функциональную полноценность. Уровень D-димера отражает образование и распад поперечно связанного фибрина, но не определяет самостоятельно локализацию или причину процесса. Интерпретация требует клинического контекста.", "Primary hemostasis\nVascular injury triggers a local vascular response. Platelets adhere, activate and aggregate. Von Willebrand factor supports platelet adhesion. Platelet number or function disorders may impair plug formation.\n\nSecondary hemostasis\nCoagulation factor interactions produce thrombin, converting fibrinogen to fibrin. The fibrin network reinforces the platelet plug. Regulated fibrinolysis later contributes to fibrin removal.\n\nLaboratory assessment\nPlatelet count measures quantity, not complete function. PT and aPTT assess different components of plasma coagulation. Findings depend on laboratory methods, medication and clinical state. Normal values do not exclude all bleeding disorders.\n\nSurgical relevance\nBlood loss may be external or internal. Mechanical vessel damage and systemic hemostatic failure are distinct and may coexist. Surgical hemostasis includes mechanical and energy-based methods; practical decisions belong to the operative team.\n\nPlatelets and primary haemostasis\nVascular injury exposes subendothelial structures and promotes platelet adhesion. Von Willebrand factor participates in binding platelets to the injured surface. Activated platelets change shape, release mediators and aggregate; fibrinogen links activated receptors on adjacent platelets. The primary plug is not equivalent to a stable fibrin clot. Distinguish platelet number from platelet function.\n\nFibrinolysis and laboratory measures\nPlasmin is formed from plasminogen and degrades fibrin. Regulation limits clot accumulation and contributes to removal. Prothrombin time and aPTT reflect different groups of plasma factors under assay conditions, not every component of haemostasis. Platelet count does not establish platelet function. D-dimer reflects formation and breakdown of cross-linked fibrin, but alone does not locate or explain the process. Interpretation requires clinical context.", "OpenStax Anatomy and Physiology 2e, §18.5 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Топография печени и желчных путей", "Liver and biliary anatomy", "Внешнее строение\nПечень расположена преимущественно в правом подреберье. Диафрагмальная поверхность выпуклая, висцеральная обращена к соседним органам. Анатомические доли, различаемые по внешним ориентирам, не совпадают полностью с функциональным делением по сосудистым и желчным ветвям.\n\nКровоснабжение\nВоротная вена приносит кровь от большей части пищеварительных органов; печёночная артерия обеспечивает дополнительный артериальный приток. Кровь проходит через синусоиды и оттекает через печёночные вены в нижнюю полую вену. Воротная вена и печёночные вены — разные сосудистые системы.\n\nЖелчные пути\nЖелчь образуется гепатоцитами, поступает в желчные канальцы и далее в систему протоков. Правый и левый печёночные протоки формируют общий печёночный проток. Пузырный проток связан с жёлчным пузырём; после их соединения образуется общий желчный проток. Варианты строения встречаются часто.\n\nТерминология\nХолелитиаз — наличие камней в желчевыводящей системе, холецистит — воспаление жёлчного пузыря, холедохолитиаз — камни общего желчного протока. Эти понятия нельзя считать синонимами. Холестаз означает нарушение образования или оттока желчи.\n\nДолька и портальная система\nПечень получает кровь через печёночную артерию и воротную вену. В классической модели дольки кровь направляется от периферии к центральной вене через синусоиды, а желчь течёт по канальцам в противоположном направлении — к желчным протокам. Портальная триада включает ветви воротной вены, печёночной артерии и желчного протока. Гепатоциты участвуют в обмене веществ, синтезе белков плазмы и образовании желчи. Топографическая сегментация органа связана с ветвлением сосудисто-желчных структур, а не только с наружными долями.\n\nЖелчные пути\nЖелчь из внутрипечёночных путей поступает в правый и левый печёночные протоки, которые обычно объединяются в общий печёночный проток. Пузырный проток соединяет желчный пузырь с внепечёночной системой; ниже места соединения расположен общий желчный проток. Варианты ветвления и соединения встречаются в нормальной анатомии. Желчный пузырь концентрирует и хранит желчь, а не производит её. При изучении топографии необходимо различать протоки, артерии и вены, не определяя структуру только по её внешнему цвету.", "External anatomy\nThe liver lies mainly in the right upper abdomen. Its diaphragmatic surface is convex; the visceral surface faces adjacent organs. External anatomical lobes do not fully correspond to functional vascular and biliary divisions.\n\nBlood supply\nThe portal vein brings blood from most digestive organs; the hepatic artery supplies arterial inflow. Blood traverses sinusoids and drains through hepatic veins into the inferior vena cava. Portal and hepatic veins are different vascular systems.\n\nBiliary tree\nHepatocytes produce bile, which enters canaliculi and ducts. Right and left hepatic ducts form the common hepatic duct. The cystic duct connects the gallbladder; its union with the hepatic duct forms the common bile duct. Anatomical variants are common.\n\nTerminology\nCholelithiasis denotes gallstones, cholecystitis gallbladder inflammation, and choledocholithiasis stones in the common bile duct. These are not synonyms. Cholestasis denotes impaired bile formation or flow.\n\nLobule and portal system\nThe liver receives blood through the hepatic artery and portal vein. In the classical lobule blood flows from the periphery to the central vein through sinusoids, whereas bile flows toward peripheral ducts. A portal triad contains branches of the portal vein, hepatic artery and bile duct. Hepatocytes contribute to metabolism, plasma protein synthesis and bile formation. Functional segmentation relates to vascular and biliary branching, not simply external lobes.\n\nBiliary tree\nBile passes into right and left hepatic ducts, which usually form the common hepatic duct. The cystic duct connects the gallbladder to the extrahepatic system; the common bile duct is distal to their junction. Normal branching and junction variants occur. The gallbladder stores and concentrates bile rather than producing it. In topographical study distinguish ducts, arteries and veins without relying solely on colour.", "OpenStax Anatomy and Physiology 2e, §23.6 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Анатомия желудка и кишечника", "Stomach and intestinal anatomy", "Желудок\nЖелудок включает кардиальную часть, дно, тело и привратниковый отдел. Большая и малая кривизны служат ориентирами. Его стенка включает слизистую, подслизистую, мышечную и серозную оболочки. Желудок выполняет резервуарную, механическую и секреторную функции.\n\nТонкая кишка\nДвенадцатиперстная кишка получает содержимое желудка и секреты пищеварительных желёз. Тощая и подвздошная кишка подвешены на брыжейке. Складки, ворсинки и микроворсинки увеличивают площадь контакта слизистой с содержимым.\n\nТолстая кишка\nСлепая кишка, ободочная кишка и прямая кишка образуют последовательные отделы. Характерные признаки ободочной кишки — ленты, гаустры и сальниковые отростки. Основные функции включают всасывание воды и электролитов, участие микробиоты в обменных процессах и формирование кала.\n\nКровоснабжение\nЧревный ствол, верхняя и нижняя брыжеечные артерии обеспечивают основные артериальные бассейны пищеварительного тракта живота. Их территории соотносятся с эмбриологическим происхождением отделов кишечника. Венозный отток большей части этих органов связан с воротной системой.\n\nСтенка пищеварительного тракта\nТиповой план стенки включает слизистую оболочку, подслизистую основу, мышечную оболочку и наружную серозную или адвентициальную оболочку. Желудок отличается дополнительным косым мышечным слоем; тонкая кишка имеет складки и ворсинки, увеличивающие площадь контакта. В толстой кишке ворсинки отсутствуют, а крипты содержат многочисленные бокаловидные клетки. Подслизистое и межмышечное нервные сплетения участвуют в регуляции секреции и моторики. Эти признаки помогают отличать отделы на гистологическом препарате.\n\nКровоснабжение и портальный отток\nЧревный ствол кровоснабжает структуры передней кишки, верхняя брыжеечная артерия — преимущественно среднюю кишку, нижняя брыжеечная — заднюю. Между бассейнами существуют анастомозы и индивидуальные варианты. Венозная кровь от большинства органов пищеварения направляется через воротную вену к печени; лимфатический отток следует региональным путям. Изучая орган, следует отдельно уметь назвать артериальный источник, венозный путь, лимфатические узлы и иннервацию.", "Stomach\nThe stomach has cardia, fundus, body and pyloric regions. Greater and lesser curvatures are landmarks. Its wall includes mucosa, submucosa, muscularis and serosa. It performs storage, mechanical and secretory functions.\n\nSmall intestine\nThe duodenum receives gastric contents and digestive secretions. Jejunum and ileum are suspended by mesentery. Folds, villi and microvilli increase mucosal contact area.\n\nLarge intestine\nCecum, colon and rectum form successive regions. Taeniae, haustra and epiploic appendages characterize the colon. Functions include water and electrolyte absorption, microbial metabolism and stool formation.\n\nBlood supply\nThe celiac trunk and superior and inferior mesenteric arteries supply major abdominal digestive territories. Their distributions relate to embryologic gut divisions. Most venous drainage is linked to the portal system.\n\nDigestive tract wall\nThe typical wall consists of mucosa, submucosa, muscular layer and outer serosa or adventitia. The stomach has an additional oblique muscle layer; small intestinal folds and villi increase contact area. The colon lacks villi and its crypts contain numerous goblet cells. Submucosal and myenteric plexuses participate in secretion and motility. These features help distinguish regions on histological sections.\n\nBlood supply and portal drainage\nThe coeliac trunk supplies foregut structures, the superior mesenteric artery mainly the midgut and the inferior mesenteric artery the hindgut. Anastomoses and individual variants occur. Venous blood from most digestive organs reaches the liver via the portal vein; lymph follows regional routes. For each organ identify arterial supply, venous drainage, lymph nodes and innervation separately.", "OpenStax Anatomy and Physiology 2e, §§23.4–23.5 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Почка и мочевыводящие пути", "Kidney and urinary tract", "Топография\nПочки лежат забрюшинно по обе стороны позвоночника. Правая обычно расположена несколько ниже левой. Ворота на медиальном крае связаны с почечной артерией, веной и лоханкой. Положение и сосудистые варианты имеют значение при интерпретации изображений.\n\nПаренхима\nКорковое вещество расположено снаружи, мозговое образует пирамиды. Почечные сосочки обращены к малым чашечкам, которые соединяются в большие чашечки и лоханку. Мочеточник отводит мочу в мочевой пузырь.\n\nФункциональная единица\nНефрон включает почечное тельце и канальцевую систему. Клубочковая фильтрация создаёт первичный фильтрат, а реабсорбция и секреция изменяют его состав. Собирательные трубочки участвуют в окончательной регуляции водного баланса.\n\nФизиологическая роль\nПочки участвуют в регуляции объёма жидкости, электролитов, кислотно-основного состояния и артериального давления. Они вырабатывают эритропоэтин и участвуют в активации витамина D. Скорость клубочковой фильтрации характеризует один аспект функции, но не описывает все функции почек.\n\nНефрон и фильтрация\nНефрон включает почечное тельце и систему канальцев. В клубочке фильтрация зависит от свойств фильтрационного барьера и градиентов давления. Фильтрационный барьер образован эндотелием капилляров, базальной мембраной и структурами подоцитов. В проксимальных канальцах происходит значительная реабсорбция веществ; петля нефрона участвует в создании осмотического градиента мозгового вещества. Дистальные канальцы и собирательные трубочки регулируют окончательный состав мочи. Собирательная система функционально связана с нефронами, но анатомически не всегда включается в определение нефрона.\n\nПочки как эндокринный орган\nПочки участвуют в регуляции артериального давления посредством ренин-ангиотензин-альдостероновой системы, образуют эритропоэтин и участвуют в активации витамина D. Эритропоэтин влияет на образование эритроцитов в костном мозге. Выработка ренина связана с сигналами о перфузии и доставке натрия к определённым структурам нефрона. Эти функции показывают, почему нарушение работы почек может сопровождаться системными изменениями, не ограниченными объёмом мочи.", "Topography\nKidneys are retroperitoneal on either side of the spine. The right usually lies lower. The medial hilum is associated with renal artery, vein and pelvis. Position and vascular variants matter in imaging.\n\nParenchyma\nThe cortex lies externally and the medulla forms pyramids. Renal papillae face minor calyces, which unite into major calyces and the pelvis. The ureter conveys urine to the bladder.\n\nFunctional unit\nThe nephron contains a renal corpuscle and tubular system. Glomerular filtration creates filtrate; reabsorption and secretion alter its composition. Collecting ducts contribute to final water regulation.\n\nPhysiological role\nKidneys regulate fluid volume, electrolytes, acid-base balance and blood pressure. They produce erythropoietin and participate in vitamin D activation. Glomerular filtration rate measures one aspect of renal function, not all functions.\n\nNephron and filtration\nThe nephron comprises a renal corpuscle and tubular system. Glomerular filtration depends on barrier properties and pressure gradients. The barrier includes capillary endothelium, basement membrane and podocyte structures. Proximal tubules reabsorb many substances; the nephron loop contributes to the medullary osmotic gradient. Distal tubules and collecting ducts regulate final urine composition. Collecting ducts are functionally associated with nephrons but are not always included in their anatomical definition.\n\nRenal endocrine roles\nThe kidneys participate in blood pressure regulation through the renin–angiotensin–aldosterone system, produce erythropoietin and contribute to vitamin D activation. Erythropoietin affects red cell formation in bone marrow. Renin release relates to perfusion and sodium delivery signals. These functions explain why kidney dysfunction can cause systemic changes beyond urine volume.", "OpenStax Anatomy and Physiology 2e, §§25.3–25.5 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Сердце: камеры, клапаны и сосуды", "Heart: chambers, valves and vessels", "Положение\nСердце расположено в средостении, окружено перикардом. Основание обращено преимущественно кверху и кзади, верхушка — влево и книзу. Стенка состоит из эндокарда, миокарда и эпикарда.\n\nПуть крови\nВенозная кровь системного круга поступает в правое предсердие, затем в правый желудочек и лёгочный ствол. После газообмена кровь возвращается по лёгочным венам в левое предсердие и далее через левый желудочек поступает в аорту.\n\nКлапанный аппарат\nТрёхстворчатый и митральный клапаны расположены между предсердиями и желудочками. Клапаны аорты и лёгочного ствола полулунные. Сухожильные хорды и сосочковые мышцы связаны с предсердно-желудочковыми клапанами, но не с полулунными.\n\nПитание миокарда и ритм\nКоронарные артерии отходят от восходящей аорты. Проводящая система обеспечивает согласованное распространение возбуждения: синусовый узел, атриовентрикулярный узел, пучок Гиса и его ветви. Электрическая активность и механическое сокращение тесно связаны, но не тождественны.\n\nПроводящая система и сердечный цикл\nСиноатриальный узел является обычным источником ритма. Возбуждение распространяется по предсердиям к атриовентрикулярному узлу, затем по пучку Гиса и его ветвям к волокнам Пуркинье. Электрическая активация предшествует механическому сокращению. Клапаны открываются и закрываются вследствие разницы давления, а не собственного активного сокращения створок. Сердечный цикл удобно изучать одновременно по изменениям давления, объёма и ЭКГ, различая электрические и механические события.\n\nКоронарное кровообращение\nКоронарные артерии отходят от начального отдела аорты. Левая коронарная артерия обычно делится на переднюю межжелудочковую и огибающую ветви. Правая коронарная артерия проходит в правой части венечной борозды. Тип доминирования определяется происхождением задней межжелудочковой ветви, а не общим размером сердца. Венозный отток значительной части миокарда происходит через венечный синус. Важно изучать варианты сосудистой анатомии и не считать схематическую модель универсальной.", "Location\nThe heart lies in the mediastinum within the pericardium. Its base faces mainly superiorly and posteriorly; its apex points left and inferiorly. The wall consists of endocardium, myocardium and epicardium.\n\nBlood flow\nSystemic venous blood enters the right atrium, then right ventricle and pulmonary trunk. After gas exchange, pulmonary veins return blood to the left atrium and left ventricle, which ejects into the aorta.\n\nValves\nTricuspid and mitral valves lie between atria and ventricles. Aortic and pulmonary valves are semilunar. Chordae tendineae and papillary muscles belong to atrioventricular, not semilunar, valves.\n\nMyocardial supply and rhythm\nCoronary arteries arise from the ascending aorta. The conduction system coordinates excitation through sinoatrial node, atrioventricular node, His bundle and branches. Electrical activity and mechanical contraction are related but not identical.\n\nConduction and cardiac cycle\nThe sinoatrial node normally initiates rhythm. Excitation spreads through the atria to the atrioventricular node and then via the His bundle, branches and Purkinje fibres. Electrical activation precedes mechanical contraction. Valves open and close in response to pressure differences, not active contraction of leaflets. Study the cycle using pressure, volume and ECG together, distinguishing electrical from mechanical events.\n\nCoronary circulation\nCoronary arteries arise near the aortic root. The left coronary artery usually divides into anterior interventricular and circumflex branches. The right coronary artery runs in the right coronary sulcus. Dominance is defined by the origin of the posterior interventricular branch, not overall heart size. Much myocardial venous drainage passes through the coronary sinus. Anatomical variants matter; a diagram is not universal.", "OpenStax Anatomy and Physiology 2e, §§19.1–19.2 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Лёгкие, бронхи и плевра", "Lungs, bronchi and pleura", "Доли и поверхности\nПравое лёгкое имеет три доли, левое — две. Левое лёгкое имеет сердечную вырезку. У лёгких различают рёберную, медиастинальную и диафрагмальную поверхности. Ворота расположены на медиастинальной поверхности.\n\nБронхиальное дерево\nТрахея разделяется на главные бронхи, затем следуют долевые и сегментарные бронхи. Более мелкие ветви переходят в бронхиолы и дыхательные отделы. Бронхолёгочный сегмент соответствует территории сегментарного бронха и артериальной ветви.\n\nПлевра\nВисцеральная плевра покрывает поверхность лёгкого, париетальная связана со стенками грудной полости. Между ними потенциальная плевральная полость. Наличие воздуха или значительного количества жидкости в ней может нарушать механику дыхания.\n\nГазообмен\nАльвеолярно-капиллярная мембрана обеспечивает диффузию газов. Эффективность зависит от вентиляции и перфузии. Дыхательные пути также очищают, согревают и увлажняют поступающий воздух.\n\nАльвеолы и газообмен\nВоздухоносные пути проводят воздух, а респираторная зона обеспечивает обмен газов. Альвеолоциты I типа формируют тонкую поверхность для диффузии; клетки II типа синтезируют сурфактант и участвуют в обновлении эпителия. Сурфактант уменьшает поверхностное натяжение. Эффективность газообмена зависит от вентиляции, перфузии, площади и толщины барьера. Вентиляция описывает движение воздуха, перфузия — кровоток; эти процессы взаимосвязаны, но не тождественны.\n\nПлевра и механика дыхания\nВисцеральная плевра покрывает лёгкое, париетальная выстилает стенки грудной полости. Между ними находится потенциальное пространство с небольшим количеством жидкости. При спокойном вдохе сокращение диафрагмы увеличивает объём грудной клетки и способствует снижению давления в альвеолах относительно атмосферного. Эластические свойства лёгких и грудной стенки определяют условия вдоха и выдоха. Плевральные взаимоотношения помогают понять, почему нарушение герметичности плеврального пространства может изменять механику дыхания.", "Lobes and surfaces\nThe right lung has three lobes and the left two; the left has a cardiac notch. Lungs have costal, mediastinal and diaphragmatic surfaces. Hila lie on the mediastinal surfaces.\n\nBronchial tree\nThe trachea divides into main bronchi, then lobar and segmental bronchi. Smaller branches become bronchioles and respiratory regions. A bronchopulmonary segment corresponds to a segmental bronchus and arterial branch.\n\nPleura\nVisceral pleura covers lungs; parietal pleura lines the thoracic cavity. The pleural cavity is a potential space. Air or substantial fluid can impair respiratory mechanics.\n\nGas exchange\nThe alveolar-capillary membrane permits gas diffusion. Efficiency depends on ventilation and perfusion. Airways also filter, warm and humidify incoming air.\n\nAlveoli and gas exchange\nConducting airways move air, while the respiratory zone exchanges gases. Type I alveolar cells form a thin diffusion surface; type II cells produce surfactant and contribute to epithelial renewal. Surfactant reduces surface tension. Gas exchange depends on ventilation, perfusion, barrier area and thickness. Ventilation describes airflow and perfusion blood flow; they are related but distinct.\n\nPleura and breathing mechanics\nVisceral pleura covers the lung; parietal pleura lines the thoracic cavity. Between them is a potential space with a small amount of fluid. During quiet inspiration diaphragm contraction enlarges thoracic volume and helps reduce alveolar pressure below atmospheric pressure. Elastic properties of the lungs and chest wall influence inspiration and expiration. Pleural relationships explain why loss of pleural integrity may alter breathing mechanics.", "OpenStax Anatomy and Physiology 2e, §§22.1–22.2 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Асептика, антисептика и стерилизация", "Asepsis, antisepsis and sterilization", "Различие понятий\nАсептика направлена на предотвращение микробного загрязнения. Антисептика — воздействие на микроорганизмы на живых тканях. Дезинфекция относится преимущественно к неживым объектам и не обязательно уничтожает все споры. Стерилизация направлена на устранение всех жизнеспособных микроорганизмов, включая споры.\n\nОбработка изделий\nПредварительная очистка удаляет загрязнения, которые могут мешать последующей обработке. Инструменты с каналами, шарнирами и сложной геометрией требуют валидированных процедур для конкретного изделия. Одноразовые и многоразовые изделия различаются требованиями производителя.\n\nКонтроль качества\nЦелостность упаковки, маркировка и записи о циклах обработки помогают прослеживать статус изделия. Физические, химические и биологические индикаторы дают разные виды информации. Они не взаимозаменяемы и оцениваются по правилам учреждения.\n\nПрактическое обучение\nСтудент должен различать чистое, дезинфицированное и стерильное изделие и понимать пути повторного загрязнения. Реальные процедуры выполняют по локальным протоколам, инструкции производителя и под контролем ответственного персонала.\n\nРазличие очистки, дезинфекции и стерилизации\nОчистка удаляет загрязнения и органический материал. Дезинфекция уменьшает количество жизнеспособных микроорганизмов в пределах эффективности конкретного метода; она не всегда обеспечивает уничтожение спор. Стерилизация направлена на устранение всех форм жизнеспособных микроорганизмов. Эффективность обработки зависит от материала изделия, его конструкции, совместимости и соблюдения валидированного процесса. Полые каналы и шарнирные соединения требуют особого внимания согласно инструкциям производителя. Не следует считать внешний блеск инструмента доказательством стерильности.\n\nКонтроль качества и ответственность\nВ операционной безопасность обеспечивается последовательностью взаимосвязанных процессов: подготовкой изделия, проверкой упаковки, соблюдением условий хранения, контролем обработки и соблюдением асептики. Химические индикаторы отражают определённые параметры воздействия, биологические — эффективность процесса в заданных условиях. Ни один отдельный внешний признак не заменяет документированную систему контроля. Студент должен знать различия понятий и роль персонала, а практические процедуры выполнять только под руководством обученного специалиста.", "Definitions\nAsepsis aims to prevent microbial contamination. Antisepsis acts on microorganisms on living tissues. Disinfection mainly concerns inanimate objects and may not eliminate all spores. Sterilization aims to eliminate all viable microorganisms, including spores.\n\nDevice reprocessing\nCleaning removes soil that may interfere with processing. Instruments with lumens, joints and complex geometry require validated device-specific procedures. Single-use and reusable devices have different manufacturer requirements.\n\nQuality control\nPackaging integrity, labeling and cycle records support traceability. Physical, chemical and biological indicators provide different information. They are not interchangeable and are evaluated under institutional policy.\n\nPractical learning\nStudents should distinguish clean, disinfected and sterile devices and understand recontamination routes. Real procedures follow local protocols, manufacturer instructions and responsible staff supervision.\n\nCleaning, disinfection and sterilisation\nCleaning removes contamination and organic material. Disinfection reduces viable microorganisms within the effectiveness of the method and does not always eliminate spores. Sterilisation aims to eliminate all viable microbial forms. Effectiveness depends on material, construction, compatibility and validated processing. Lumens and joints require attention according to manufacturer instructions. Visible cleanliness does not prove sterility.\n\nQuality control and responsibility\nOperating-room safety depends on linked processes: preparation, packaging checks, storage, processing control and aseptic practice. Chemical indicators reflect selected exposure parameters; biological indicators assess effectiveness under defined conditions. No single visible sign replaces documented quality control. Students should know the concepts and staff roles; practical procedures require trained supervision.", "CDC Guideline for Disinfection and Sterilization in Healthcare Facilities · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."], ["Поджелудочная железа: строение и функции", "Pancreas: structure and function", "Топография\nПоджелудочная железа располагается преимущественно позади желудка. Головка прилежит к изгибу двенадцатиперстной кишки, тело проходит поперечно, хвост направлен к воротам селезёнки. Крючковидный отросток связан с областью верхних брыжеечных сосудов.\n\nЭкзокринная часть\nАцинусы вырабатывают пищеварительные ферменты, а протоковые клетки участвуют в секреции жидкости и бикарбоната. Главный панкреатический проток проходит вдоль железы. Варианты соединения протоков имеют клиническое значение.\n\nЭндокринная часть\nОстровки поджелудочной железы включают несколько типов клеток. Бета-клетки секретируют инсулин, альфа-клетки — глюкагон. Гормоны регулируют энергетический обмен, в том числе концентрацию глюкозы в крови.\n\nКлиническая терминология\nПанкреатит — воспаление железы. Экзокринная недостаточность связана с нарушением пищеварения, эндокринная — с гормональной регуляцией. Симптомы и отдельные лабораторные показатели не определяют самостоятельно причину заболевания.\n\nЭкзокринная и эндокринная части\nАцинусы поджелудочной железы образуют пищеварительные ферменты, а клетки протоков выделяют жидкость и бикарбонат. Секрет направляется в двенадцатиперстную кишку. Островки содержат эндокринные клетки, выделяющие гормоны непосредственно в кровоток. Инсулин и глюкагон участвуют в регуляции гликемии, но островковая ткань включает и другие клеточные типы. При изучении органа нужно отделять протоковую анатомию от сосудистого снабжения эндокринной части.\n\nТопография и протоки\nГоловка поджелудочной железы располагается в изгибе двенадцатиперстной кишки; тело проходит поперечно, хвост направляется к селезёнке. Большая часть железы расположена забрюшинно. Главный панкреатический проток проходит через железу; его соединение с желчным протоком и наличие добавочного протока вариабельны. Тесные отношения с двенадцатиперстной кишкой, селезёночными сосудами и крупными сосудами задней стенки живота объясняют значение топографической анатомии.", "Topography\nThe pancreas lies mainly posterior to the stomach. Its head adjoins the duodenal curve, body crosses the abdomen and tail approaches the splenic hilum. The uncinate process is related to the superior mesenteric vessels.\n\nExocrine portion\nAcini produce digestive enzymes; duct cells contribute fluid and bicarbonate. The main pancreatic duct runs along the gland. Ductal variants have clinical significance.\n\nEndocrine portion\nPancreatic islets contain several cell types. Beta cells secrete insulin and alpha cells glucagon. These hormones regulate energy metabolism, including blood glucose.\n\nClinical terminology\nPancreatitis is inflammation of the gland. Exocrine insufficiency affects digestion; endocrine insufficiency affects hormonal regulation. Symptoms and isolated laboratory findings do not alone identify disease cause.\n\nExocrine and endocrine components\nPancreatic acini produce digestive enzymes, while duct cells secrete fluid and bicarbonate. Secretions enter the duodenum. Islets contain endocrine cells releasing hormones into the bloodstream. Insulin and glucagon regulate glycaemia, but islet tissue contains other cell types. Distinguish duct anatomy from vascular supply to the endocrine component.\n\nTopography and ducts\nThe pancreatic head lies within the duodenal curve; the body extends transversely and the tail approaches the spleen. Most of the pancreas is retroperitoneal. The main duct traverses the gland; its junction with the bile duct and the accessory duct vary. Close relations to the duodenum, splenic vessels and major posterior abdominal vessels explain the importance of topographical anatomy.", "OpenStax Anatomy and Physiology 2e, §23.6 · Дополнительные пояснения Medical AI, редакционный материал / Additional editorial study notes."]];

function paintLocal072(){let c=$('organCanvas072');if(!c)return;if(!renderCache074||renderCache074.mesh!==meshLocal072)renderCache074=smooth074(meshLocal072);let ctx=c.getContext('2d'),[a,b]=rot072,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),W=c.width,H=c.height,k=Math.min(W/3.6,H/2.6)*scale072;let bg=ctx.createRadialGradient(W*.50,H*.40,10,W*.5,H*.45,W*.67);bg.addColorStop(0,'#263e51');bg.addColorStop(.65,'#142435');bg.addColorStop(1,'#0a1420');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H*.86);ctx.scale(1,.22);let shadow=ctx.createRadialGradient(0,0,0,0,0,k*.95);shadow.addColorStop(0,'#0009');shadow.addColorStop(1,'#0000');ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,k*.95,0,Math.PI*2);ctx.fill();ctx.restore();let transform=([x,y,z])=>{let u=ca*x+sa*z,w=-sa*x+ca*z;return [u,cb*y-sb*w,sb*y+cb*w]};let faces=renderCache074.tris.map(t=>{let pts=t.pts.map(transform),norm=t.ns.map(transform),[A,B,C]=pts;return {pts,norm,col:t.col,z:(A[2]+B[2]+C[2])/3}}).sort((a,b)=>a.z-b.z);let shade=(n,col)=>{let diffuse=Math.abs(n[0]*-.40+n[1]*.55+n[2]*.73),spec=Math.pow(Math.abs(n[0]*-.20+n[1]*.28+n[2]*.94),22),rim=Math.pow(1-Math.abs(n[2]),2);return col.map((v,i)=>Math.round(Math.max(0,Math.min(255,v*(.52+.57*diffuse)+28*spec+rim*(i===2?19:8)))))};for(let f of faces){let pts=f.pts.map(([x,y,z])=>{let p=4.9/(4.9-z);return [W/2+x*k*p,H*.49-y*k*p]}),colors=f.norm.map(n=>shade(n,f.col));let avg=colors[0].map((v,i)=>Math.round((v+colors[1][i]+colors[2][i])/3));ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle='rgb('+avg.join(',')+')';ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.7;ctx.stroke()}ctx.fillStyle='#9bb7cc';ctx.font='14px system-ui';ctx.fillText(tr('УЧЕБНАЯ 3D-СХЕМА','EDUCATIONAL 3D SCHEMATIC'),18,25);ctx.fillText('360°  ·  '+Math.round(scale072*100)+'%',18,H-17)}
const toolMore073=[["Прямая и угловая оптика различаются направлением обзора; оптика также может отличаться диаметром и совместимостью с видеосистемой.", "Straight and angled scopes differ in viewing direction; diameter and video-system compatibility vary.", "Запотевание, загрязнение и блики ухудшают обзор. Световод и камера не являются режущими инструментами.", "Fogging, contamination and glare reduce visibility. The light guide and camera are not cutting tools.", "Найдите объектив, световой разъём и окуляр или соединение камеры.", "Identify the objective, light connector and eyepiece or camera connection."], ["Различают канюли с клапанами, обтураторы с разной геометрией, одноразовые и многоразовые системы.", "Cannulas with valves, obturators with different geometries, and disposable or reusable systems exist.", "Троакарная система связана с риском повреждения тканей при доступе. Наличие клапана не гарантирует герметичность.", "Trocar access carries tissue injury risks. A valve does not guarantee a seal.", "Различите полую канюлю, клапанный корпус и обтуратор.", "Distinguish hollow cannula, valve housing and obturator."], ["Фенестрированные бранши имеют отверстия; существуют широкие атравматические и более узкие зубчатые варианты. Механизм блокировки зависит от модели.", "Fenestrated jaws have openings; wide atraumatic and narrower toothed designs exist. Locking mechanisms vary.", "Даже атравматический инструмент может повредить ткань при чрезмерной нагрузке. Зубчатый профиль нельзя считать универсальным.", "Even atraumatic instruments can damage tissue under excessive load. Toothed jaws are not universal.", "Сравните рабочие поверхности граспера, диссектора и иглодержателя.", "Compare the working surfaces of a grasper, dissector and needle holder."], ["Режущие бранши могут быть прямыми, изогнутыми или иметь специальное покрытие. Некоторые модели совместимы с электрохирургией, другие нет.", "Blades may be straight, curved or specially coated. Some models support electrosurgery; others do not.", "Механические ножницы и энергетические инструменты различаются механизмом повреждения тканей. Изоляция имеет значение только для соответствующих устройств.", "Mechanical scissors and energy devices differ in tissue injury mechanisms. Insulation matters for applicable devices.", "Распознайте две режущие кромки, шарнир и стержень.", "Identify two cutting edges, pivot and shaft."], ["Губки бывают с насечкой и различным профилем, рукоятка — с фиксатором или без него. Важна совместимость с размером иглы.", "Jaws may have different profiles and serrations; handles may lock or not. Compatibility with needle size matters.", "Повреждённая насечка или люфт могут ухудшить удержание. Граспер для тканей не следует считать заменой иглодержателя.", "Damaged serrations or play may impair retention. A tissue grasper is not a substitute for a needle holder.", "Объясните, почему короткие прочные губки отличаются от длинных захватывающих браншей.", "Explain how short sturdy jaws differ from long grasping jaws."], ["Существуют одноразовые, многоразовые и многозарядные конструкции, а также системы для металлических или полимерных клипс.", "Disposable, reusable and multi-fire designs exist, as do systems for metal or polymer clips.", "Клипсы и аппликаторы не являются взаимозаменяемыми без подтверждения совместимости. Назначение конкретного изделия определяется инструкцией.", "Clips and appliers are not interchangeable without confirmed compatibility. Device indications depend on instructions.", "Различите клипсу, магазин и рабочие губки аппликатора.", "Distinguish clip, cartridge and applicator jaws."], ["Системы отличаются числом каналов, конструкцией клапанов и формой наконечника. Возможны отдельные устройства для аспирации и орошения.", "Systems vary by channels, valves and tip design. Suction and irrigation may be separate devices.", "Закупорка канала, утечка и контакт с тканью влияют на работу. Контроль жидкости относится к задачам операционной команды.", "Blockage, leaks and tissue contact affect performance. Fluid management belongs to the operative team.", "Определите каналы жидкости и органы управления, не путайте с инсуффлятором.", "Identify fluid channels and controls; distinguish from the insufflator."], ["Аппарат включает газовый тракт, датчики, интерфейс контроля и соединительную магистраль. Различия моделей касаются мониторинга и дополнительных функций.", "The device includes a gas path, sensors, control interface and tubing. Models vary in monitoring and additional functions.", "Газовая среда влияет на физиологию пациента. Настройки и управление определяются медицинской командой, не учебной карточкой.", "The gas environment affects patient physiology. Settings are determined by the clinical team, not a study card.", "Отличите показатели давления от показателей потока и расхода газа.", "Distinguish pressure from flow and gas consumption indicators."], ["Различают сменные лезвия разных профилей, многоразовые рукоятки и одноразовые скальпели. Лезвие и рукоятка должны соответствовать друг другу.", "Replaceable blades of different shapes, reusable handles and disposable scalpels exist. Blade and handle must be compatible.", "Острое лезвие требует обращения согласно правилам безопасности острых предметов; карточка не описывает технику разреза.", "Sharp blades require sharps safety procedures; this card does not teach incision technique.", "Различите рукоятку, посадочную часть и лезвие.", "Distinguish handle, mounting section and blade."], ["Анатомические пинцеты обычно имеют насечку без выраженных зубцов; хирургические могут иметь зубцы. Специальные варианты отличаются шириной и формой кончика.", "Dressing forceps typically have serrations without prominent teeth; tissue forceps may have teeth. Specialized tips vary in width and shape.", "Форма кончика влияет на взаимодействие с тканью. Название «атравматический» не означает невозможность травмы.", "Tip design affects tissue interaction. Atraumatic does not mean incapable of injury.", "Сравните зубчатый и гладкий рабочие концы.", "Compare toothed and smooth working ends."], ["Прямые и изогнутые зажимы отличаются длиной и рабочим профилем. Кремальера фиксирует положение; насечки бывают на части губок или по их длине.", "Straight and curved clamps vary in length and jaw profile. A ratchet locks position; serrations may cover part or all of the jaws.", "Кровоостанавливающий зажим нельзя автоматически считать сосудистым атравматическим зажимом. Давление и профиль губок имеют значение.", "A hemostat is not automatically an atraumatic vascular clamp. Pressure and jaw profile matter.", "Найдите кольца, кремальеру, шарнир и бранши.", "Identify rings, ratchet, pivot and jaws."], ["Ручные ретракторы удерживаются ассистентом; самофиксирующиеся имеют механизм фиксации. Рабочая часть бывает крючком, лопаткой или рамой.", "Handheld retractors are held by an assistant; self-retaining versions have locking mechanisms. Working ends may be hooks, blades or frames.", "Избыточная длительная нагрузка может травмировать ткани. Тип ретрактора зависит от анатомической области.", "Excessive sustained load can injure tissues. Retractor type depends on the anatomical region.", "Сравните ручную лопатку и самофиксирующийся ретрактор.", "Compare a handheld blade with a self-retaining retractor."], ["Кольцевые иглодержатели имеют шарнир и кремальеру; пружинные и микрохирургические варианты устроены иначе. Губки часто короткие и рельефные.", "Ring-handled holders have a pivot and ratchet; spring and microsurgical versions differ. Jaws are often short and textured.", "Износ губок снижает качество фиксации. Размер инструмента должен соответствовать игле и учебной задаче.", "Jaw wear reduces retention. Instrument size should match the needle and learning task.", "Сравните короткие губки иглодержателя с более длинными губками зажима.", "Compare short needle-holder jaws with longer clamp jaws."], ["Ножницы Майо обычно более массивные, Метценбаума — более тонкие и длинные относительно рабочих браншей. Существуют специальные ножницы для шовного материала.", "Mayo scissors tend to be heavier, Metzenbaum scissors more delicate with relatively long shanks. Dedicated suture scissors exist.", "Не все ножницы рассчитаны на одинаковые ткани и материалы. Затупление и нарушение шарнира влияют на работу.", "Not all scissors suit the same tissues or materials. Blunt blades and pivot defects affect performance.", "Объясните отличие ножниц от зажима: режущие кромки вместо захватывающих поверхностей.", "Explain the difference from a clamp: cutting edges rather than grasping surfaces."]];

const toolExtra074=[["Лапароскоп — часть системы визуализации, а не самостоятельная камера. Объектив формирует изображение, оптический тракт передаёт его к проксимальному соединению, световод доставляет свет. На учебном стенде полезно различать оптику, кабель освещения, видеокамеру и монитор. Диаметр и угол обзора — разные характеристики.", "A laparoscope is part of the imaging system, not a standalone camera. The objective forms an image, the optical path transmits it and the light guide delivers illumination. Distinguish scope, illumination cable, camera and monitor. Diameter and viewing angle are separate characteristics."], ["Троакар — комплект доступа; после удаления обтуратора канюля образует канал. Клапан ограничивает утечку газа, а наружный корпус служит для соединения элементов системы. Внешне похожий аспирационный инструмент имеет иной принцип работы: его просвет предназначен для жидкости, а не для проведения других инструментов.", "A trocar is an access assembly; after obturator removal the cannula provides a channel. Its valve limits gas leakage and the housing connects the assembly. A suction device instead carries fluid through its lumen."], ["Форма рабочих браншей определяет площадь контакта и распределение нагрузки. Фенестрация уменьшает количество сплошного металла в губках, но не делает любой захват безопасным. В отличие от ножниц, у граспера нет парных режущих кромок; в отличие от иглодержателя, он рассчитан на удержание ткани, а не на фиксацию иглы.", "Jaw geometry determines contact area and load distribution. Fenestration reduces solid metal in the jaws but does not make every grasp safe. Unlike scissors it lacks paired cutting edges; unlike a needle holder it is designed for tissue rather than needle retention."], ["Рабочая часть состоит из двух лезвий, соединённых шарниром. Различают прямой и изогнутый профиль; форма связана с доступом и обзором. Затупление или люфт шарнира изменяют взаимодействие лезвий. Электрохирургическая функция, если она предусмотрена, требует отдельной маркировки и совместимости.", "Two blades meet at a pivot. Straight and curved profiles relate to access and visibility. Blunt edges or pivot play affect blade interaction. An electrosurgical feature, when present, requires separate markings and compatibility."], ["Иглодержатель должен противодействовать вращению иглы в губках. Поэтому рабочая часть обычно более массивная и короткая, чем у захватывающих щипцов. Важны насечка, состояние рабочих поверхностей и характер механизма фиксации. Длина стержня не определяет размер совместимой иглы.", "A needle holder resists rotation of the needle in its jaws. The working part is usually shorter and sturdier than tissue forceps. Serrations, surface condition and locking mechanism matter. Shaft length does not determine compatible needle size."], ["Клип-аппликатор представляет собой систему, в которой геометрия губок рассчитана на определённую клипсу. Одноразовые и многозарядные модели различаются устройством подачи. Не всякий инструмент с узкими браншами является аппликатором: следует проверять маркировку, наличие клипсы и тип механизма.", "A clip applier has jaws designed for a particular clip. Disposable and multi-fire models differ in feed design. Not every narrow-jawed instrument is an applier; check markings, clip and mechanism type."], ["Аспирация и ирригация — две различные функции обращения с жидкостью. Каналы могут объединяться в одной рукоятке или быть раздельными. Инструмент отличается от оптики отсутствием объектива, а от инсуффлятора — назначением жидкостного тракта. Важны проходимость, герметичность и совместимость соединений.", "Suction and irrigation are distinct fluid-handling functions. Channels may share a handle or be separate. The instrument lacks the objective of a scope and differs from an insufflator by its fluid path. Patency, seals and connector compatibility matter."], ["Инсуффлятор относится к аппаратуре, а не к ручному инструментарию. Он включает газовый тракт, измерительные компоненты и систему управления. Показатели давления и потока отражают разные физические величины. Изучение аппаратуры должно включать различение дисплея, трубки, разъёма и источника газа.", "An insufflator is equipment rather than a handheld instrument. It includes a gas path, measurement components and controls. Pressure and flow are distinct physical quantities. Study the display, tubing, connectors and gas source as separate components."], ["Скальпели различаются конструкцией рукоятки и лезвия: одноразовые изделия могут быть цельными, многоразовые — со сменными лезвиями. Рабочую форму определяют контур режущей части и геометрия острия. Скальпель следует отличать от ножниц, где разрез обеспечивается взаимодействием двух лезвий.", "Scalpels vary in handle and blade construction: disposable devices may be integrated and reusable handles may accept replaceable blades. Blade contour and tip geometry determine the working form. Scissors instead cut through interaction of two blades."], ["Пинцеты различаются рабочими кончиками: зубчатые, гладкие, с насечкой и специализированные атравматические варианты. У обычного пинцета упругость браншей раскрывает рабочую часть после прекращения сжатия. Кольцевой зажим имеет шарнир и часто кремальеру; это принципиально другой механизм.", "Forceps vary by tip: toothed, smooth, serrated and specialised atraumatic designs. Spring tension opens ordinary thumb forceps when compression is released. Ring-handled clamps have a pivot and often a ratchet, a different mechanism."], ["Кровоостанавливающий зажим обычно имеет кольца, шарнир, фиксатор и рабочие бранши. Длина и направление насечки зависят от разновидности. Не следует путать его с иглодержателем: последний имеет более короткие рабочие губки для удержания иглы. Состояние фиксатора и совмещение браншей важны для идентификации исправного изделия.", "A haemostat usually has rings, pivot, ratchet and jaws. Serration length and direction vary. Unlike a needle holder it is not primarily designed to retain a needle. Lock condition and jaw alignment matter when identifying an intact instrument."], ["Ранорасширители бывают ручными и самофиксирующимися. Рабочая часть может быть в виде лопатки, крючка или нескольких зубцов; форма определяет характер контакта с тканью. Они предназначены для отведения, а не для захвата или рассечения. Модель на рисунке представляет лишь один распространённый общий тип.", "Retractors may be handheld or self-retaining. Working ends can be blades, hooks or multiple prongs; shape determines tissue contact. Their purpose is retraction rather than gripping or cutting. The drawing depicts only one general type."], ["Иглодержатель для открытой хирургии имеет кольцевые или пружинные рукоятки в зависимости от модели. Рабочие губки приспособлены для удержания иглы, поэтому их профиль отличается от кровоостанавливающих зажимов. Иглодержатель не является синонимом пинцета или зажима.", "An open-surgery needle holder may have ring or spring handles. Its jaws retain a needle and differ in profile from haemostats. A needle holder is not synonymous with thumb forceps or a clamp."], ["Ножницы классифицируют по форме и длине лезвий, наличию тупых или острых концов и назначению. Ножницы для тканей и для шовного материала не обязательно взаимозаменяемы. В отличие от кровоостанавливающего зажима, на рабочих частях видны режущие кромки, а кремальера обычно отсутствует.", "Scissors are classified by blade shape and length, blunt or sharp tips and purpose. Tissue and suture scissors are not necessarily interchangeable. Unlike haemostats they have cutting edges and generally lack a ratchet."]];
function localTool072(i,back){let a=instruments[i],n=toolNotes072[i];return `<div class="actions">${btn(tr('Назад','Back'),`go('${back||'tools'}')`)}</div><section><div class="tag">${tr('ВСТРОЕНО · ОФЛАЙН','BUILT IN · OFFLINE')}</div><h2>${esc(tr(a[0],a[1]))}</h2><p>${esc(tr(a[1],a[0]))} · ${esc(tr(a[2],a[3]))}</p>${toolArt074(i)}<small>${tr('Авторская предметная иллюстрация, не фотография конкретного изделия','Editorial instrument illustration, not a photograph of a specific device')}</small><h3>${tr('Что это','What it is')}</h3><p>${esc(tr(a[4],a[5]))}</p><h3>${tr('Устройство','Construction')}</h3><p>${esc(tr(n[0],n[3]))}</p><h3>${tr('Назначение','Purpose')}</h3><p>${esc(tr(n[1],n[4]))}</p><h3>${tr('Как отличить','How to distinguish')}</h3><p>${esc(tr(n[2],n[5]))}</p><h3>${tr('Разновидности','Variants')}</h3><p>${esc(tr(toolMore073[i][0],toolMore073[i][1]))}</p><h3>${tr('Конструкция и распознавание: подробнее','Construction and recognition: in depth')}</h3><p style="line-height:1.85">${esc(tr(...toolExtra074[i]))}</p><h3>${tr('Ограничения и безопасность','Limitations and safety')}</h3><p>${esc(tr(toolMore073[i][2],toolMore073[i][3]))}</p><h3>${tr('Самопроверка','Self-check')}</h3><p>${esc(tr(toolMore073[i][4],toolMore073[i][5]))}</p><details><summary>${tr('Справочные источники и статус','References and status')}</summary><p>Medical AI · ${tr('авторский справочный текст, не цитата. Требуется проверка преподавателем.','original reference text, not a quotation. Instructor review required.')} American College of Surgeons, Commonly Used Surgical Instruments; Safety considerations in laparoscopic surgery: A narrative review (2022), PMCID: PMC8788169.</p></details></section>`}
function moduleList072(){return `<section><h2>${tr('Встроенные материалы для чтения','Built-in study readings')}</h2><p>${tr('Авторские учебные пояснения, не оригинальные учебники и не замена литературе. Доступны без интернета.','Original study explanations, not textbooks or a replacement for literature. Available offline.')}</p><div class="grid">${modules072.map((a,i)=>`<div class="card"><div class="tag">${tr('ОФЛАЙН · СПРАВОЧНЫЙ МАТЕРИАЛ','OFFLINE · STUDY READING')}</div><h3>${esc(tr(a[0],a[1]))}</h3>${btn(tr('Читать','Read'),`openDetail08('module',${i})`,'primary')}</div>`).join('')}</div></section>`}
function localModule072(i,back){let a=modules072[i],parts=tr(a[2],a[3]).split('\n\n');return `<div class="actions">${btn(tr('Назад','Back'),`go('${back||'offline'}')`)}</div><section><div class="tag">${tr('АВТОРСКИЙ УЧЕБНЫЙ МАТЕРИАЛ · ОФЛАЙН','EDITORIAL STUDY MATERIAL · OFFLINE')}</div><h2>${esc(tr(a[0],a[1]))}</h2><p>${tr('Не оригинальная глава учебника. Требуется экспертная проверка.','Not an original textbook chapter. Expert review required.')}</p><div class="panel"><h3>${tr('Оглавление','Contents')}</h3>${parts.map((p,j)=>`<button style="display:block;margin:6px 0" onclick="document.getElementById('part073-${j}').scrollIntoView({block:'start'})">${j+1}. ${esc(p.split('\n')[0])}</button>`).join('')}</div><input id="modFind073" placeholder="${tr('Поиск внутри материала','Find in reading')}" oninput="findModule073()"><p id="modCount073" aria-live="polite"></p><div id="modText073">${parts.map((p,j)=>`<div id="part073-${j}" class="studyPart073" style="scroll-margin-top:90px"><h3>${esc(p.split('\n')[0])}</h3><p style="line-height:1.85">${esc(p.split('\n').slice(1).join('\n'))}</p></div>`).join('')}</div><div class="actions">${btn(tr('Сохранить в конспект','Save to notes'),`noteModule073(${i})`)}${btn(tr('Объяснить выделение','Explain selection'),`explainModule073(${i})`)}</div><p id="modStatus073" role="status"></p><details><summary>${tr('Литература для проверки','References for verification')}</summary><p>${esc(a[4])}</p></details></section>`}
function findModule073(){let q=$('modFind073').value.trim().toLowerCase(),count=0;document.querySelectorAll('.studyPart073').forEach(el=>{let match=!q||el.textContent.toLowerCase().includes(q);el.hidden=!match;if(match)count++});$('modCount073').textContent=tr('Разделов: ','Sections: ')+count}
function noteModule073(i){let a=modules072[i];notes+=(notes?'\n\n':'')+tr(a[0],a[1])+'\n'+(String(window.getSelection()).trim()||tr(a[2],a[3]));put('med-notes',notes);$('modStatus073').textContent=tr('Сохранено','Saved')}
function explainModule073(i){let text=String(window.getSelection()).trim();if(!text){$('modStatus073').textContent=tr('Сначала выделите фрагмент.','Select an excerpt first.');return}go('ai');$('prompt').value=tr('Объясни учебный фрагмент: ','Explain this study excerpt: ')+text}

const papers073=[['PMC11992859','Трудная лапароскопическая холецистэктомия: обзор','The difficult laparoscopic cholecystectomy: a narrative review','2025'],['PMC5897463','Результаты и безопасность лапароскопической холецистэктомии: систематический обзор','Outcome trends and safety measures after 30 years of laparoscopic cholecystectomy','2018'],['PMC10978673','Вариативная практика в лапароскопическом симуляционном обучении','Variable practice is superior to self-directed training for laparoscopic simulator training','2024'],['PMC5216104','Недорогие лапароскопические тренажёры: систематический обзор','A systematic review of low-cost laparoscopic simulators','2017'],['PMC11525308','Дистанционное и очное обучение лапароскопии','Comparison of distance versus in-person laparoscopy training','2024'],['PMC11133174','Структурированная обратная связь и разбор видео при обучении лапароскопии','Structured feedback and operative video debriefing in laparoscopic training','2024']];
function articlePanel073(){return `<section id="articlePanel074"><h2>${tr('Оригинальные научные статьи','Original research articles')}</h2><p>${tr('Каталог публикаций. Полные тексты доступны только для вложенных или сохранённых оригиналов. Серверная загрузка проверяет лицензию. Русские названия не являются переводом статьи; иллюстрации и приложения не включены.','Publication catalogue. Only bundled or saved originals can be read offline. Server import checks the license. Figures and supplements are not included.')}</p><div id="articleStatus073" role="status"></div><div class="grid">${papers073.map((a,i)=>{let f=files07.find(x=>x.id==='oa-'+a[0]);return `<div class="card"><small>${a[0]} · ${a[3]} · EN</small><h3>${esc(tr(a[1],a[2]))}</h3>${f?btn(tr('Читать сохранённый текст','Read saved text'),`read07('${f.id}')`,'primary'):(portable074()?missing074():btn(tr('Получить оригинал с сервера','Fetch original via server'),`downloadArticle073(${i})`,'primary'))}</div>`}).join('')}</div></section>`}
function parseArticle073(xml){let doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw Error('Invalid XML');let a=doc.querySelector('article');let lic=Array.from(a?.querySelectorAll('permissions license')||[]).flatMap(x=>[x.getAttribute('xlink:href')||x.getAttribute('href')||'',...Array.from(x.querySelectorAll('*')).map(y=>y.getAttribute('xlink:href')||y.getAttribute('href')||'')]);let license=lic.find(x=>/^https?:\/\/creativecommons\.org\/licenses\/by\/(4\.0|3\.0|2\.0)\/?$/i.test(x));if(!license)throw Error(tr('Лицензия CC BY не подтверждена в документе. Загрузка отменена.','CC BY license not confirmed in document. Download cancelled.'));let title=a.querySelector('article-title')?.textContent.trim(),body=a.querySelector('body');if(!title||!body||body.textContent.trim().length<500)throw Error('Full text unavailable');let authors=Array.from(a.querySelectorAll('article-meta contrib[contrib-type="author"] name')).map(x=>x.textContent.trim().replace(/\s+/g,' ')).join('; ');let journal=a.querySelector('journal-title')?.textContent.trim()||'';let doi=Array.from(a.querySelectorAll('article-id')).find(x=>x.getAttribute('pub-id-type')==='doi')?.textContent||'';let parts=[];function walk(el){let n=el.localName;if(['title','p','caption','table-wrap','ref','list-item'].includes(n)){parts.push(el.textContent.trim().replace(/\s+/g,' '));return}for(let child of el.children)walk(child)};for(let el of a.querySelectorAll('article-meta > abstract, article > body, article > back'))walk(el);return {title,authors,journal,doi,license,text:[title,authors,journal,doi?'DOI: '+doi:'','License: '+license,'Original English text, converted from JATS XML. Figures, layout and supplements not included.','',...parts].join('\n\n')}}
async function downloadArticle073(i){let a=papers073[i],st=$('articleStatus073');if(st)st.textContent=tr('Загрузка оригинала…','Downloading original…');try{if(location.protocol==='file:'||location.origin==='null')throw Error(tr('Текст не встроен в этот файл.','Text is not bundled in this file.'));let r=await fetch('/api/fulltext?pmcid='+a[0],{signal:AbortSignal.timeout(22000)});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'HTTP '+r.status);let data=parseArticle073(await r.text());let f=new Blob([data.text],{type:'text/plain'});let row={id:'oa-'+a[0],kind:'book',name:data.title,meta:data.authors+' · '+data.journal+' · '+a[3]+' · '+data.license,source:'https://pmc.ncbi.nlm.nih.gov/articles/'+a[0]+'/',file:f,ext:'txt',size:f.size,text:data.text};try{await op07('readwrite',x=>x.put(row));await refresh07()}catch{row.sessionOnly=true;files07=files07.filter(x=>x.id!==row.id).concat(row)};read07(row.id);if(row.sessionOnly){let p=document.createElement('p');p.textContent=tr('Браузер не сохранил файл постоянно: только текущий сеанс.','Browser did not persist file: current session only.');$('reading07').prepend(p)}}catch(e){if(st)st.textContent=tr('Не удалось загрузить: ','Download failed: ')+e.message}}
function related073(title){let q=title.toLowerCase(),indices=/лапар|lapar|эндоскоп|endosc|малоинвазив|minimal/.test(q)?[0,3]:/гемост|кровот|hemost|bleed/.test(q)?[2]:/асеп|антисеп|asep|antise/.test(q)?[8]:/печен|печён|желч|liver|biliary|gall/.test(q)?[3]:/желуд|киш|stomach|intestin|colon/.test(q)?[4]:/почек|почк|kidney|renal/.test(q)?[5]:/поджелуд|pancrea/.test(q)?[9]:[];return indices.length?`<div class="panel"><h3>${tr('Встроенные учебные материалы по теме','Built-in related study readings')}</h3>${indices.map(i=>btn(esc(tr(modules072[i][0],modules072[i][1])),`openDetail08('module',${i})`,'primary')).join(' ')}</div>`:''}

const originals073=[['ssmu4245','Хирургические и анатомические инструменты','Surgical and anatomical instruments (Russian)','Шматов С. В., Осипова О. Л., Курочкина О. С. · СибГМУ, 2024 · CC BY-NC 4.0','https://elar.ssmu.ru/bitstream/20.500.12701/4245/1/tut_ssmu-2024-17.pdf','https://elar.ssmu.ru/handle/20.500.12701/4245','7.46 MB'],['ssmu3984','Топографическая анатомия и оперативная хирургия','Topographic anatomy and operative surgery (Russian)','Осипова О. Л. и соавт. · СибГМУ, 2024 · CC BY-NC 4.0','https://elar.ssmu.ru/bitstream/20.500.12701/3984/1/tut_ssmu-2024-4.pdf','https://elar.ssmu.ru/handle/20.500.12701/3984','12.8 MB']];
function bookPanel073(){return `<section id="bookPanel074"><h2>${tr('Оригинальные русские пособия','Original Russian textbooks')}</h2><p>${tr('Две книги СибГМУ 2024 года. Некоммерческое использование CC BY-NC 4.0. Доступность полного текста указана на каждой карточке. В автономной сборке читаются только вложенные или ранее сохранённые файлы.','Two 2024 Siberian State Medical University textbooks, CC BY-NC 4.0. Read bundled or previously stored files offline. Availability is shown on each card.')}</p><p id="bookStatus073" role="status"></p><div class="grid">${originals073.map((a,i)=>`<article class="card"><small>RU · ${a[6]}</small><h3>${esc(tr(a[1],a[2]))}</h3><p>${esc(a[3])}</p>${files07.some(f=>f.id===a[0])?btn(tr('Читать сохранённую книгу','Read saved book'),`read07('${a[0]}')`,'primary'):(portable074()?missing074():btn(tr('Получить оригинал с сервера','Fetch original via server'),`downloadBook073(${i})`,'primary'))}</article>`).join('')}</div></section>`}
async function fetchAsset073(url,id){if(location.protocol==='file:'||location.origin==='null')throw Error(tr('В этой HTML-сборке оригинал отсутствует. Интернет здесь не поможет: используйте сборку с вложенными файлами.','The original is not bundled in this HTML. Use a content-packed build.'));let r=await fetch('/api/asset?id='+encodeURIComponent(id),{signal:AbortSignal.timeout(22000)});if(!r.ok){let data=await r.json().catch(()=>({}));throw Error(data.error||'HTTP '+r.status)}return await r.blob()}
async function downloadBook073(i){let a=originals073[i],st=$('bookStatus073');if(st)st.textContent=tr('Загружаем оригинальный PDF…','Downloading original PDF…');try{let blob=await fetchAsset073(a[4],a[0]);if(blob.size>50*1024*1024||await blob.slice(0,5).text()!=='%PDF-')throw Error('Invalid PDF');let row={id:a[0],kind:'book',name:a[1],meta:a[3],source:a[5],file:blob,ext:'pdf',size:blob.size,text:''};try{await op07('readwrite',x=>x.put(row));await refresh07()}catch{row.sessionOnly=true;files07=files07.filter(x=>x.id!==row.id).concat(row)}read07(row.id);if(row.sessionOnly){let p=document.createElement('p');p.textContent=tr('Только текущий сеанс: постоянное хранение недоступно.','Current session only: persistent storage unavailable.');$('reading07').prepend(p)}}catch(e){if(st)st.textContent=tr('Оригинал не получен. Это может быть запрет источника, недоступность сервера или отсутствие файла. ','Original unavailable: source restriction, server failure or missing file. ')+e.message}}

function photoPanel073(){return `<section id="photoPanel074"><h2>${tr('Фотографии инструментов','Instrument photographs')}</h2><p>${tr('Два групповых снимка в каталоге. Снимок виден только если его файл вложен или сохранён. Индивидуальные фотографии ещё не собраны.','Two group photographs in the catalogue. Available only if bundled or saved. Individual photographs are not yet collected.')}</p><p id="photoStatus073" role="status"></p><div class="grid">${photos073.map((a,i)=>{let f=files07.find(x=>x.id===a[0]);return `<div class="card"><h3>${esc(tr(a[1],a[2]))}</h3>${f&&f.text.startsWith('data:image/jpeg;base64,')?`<img alt="${esc(tr(a[1],a[2]))}" style="width:100%;border-radius:10px" src="${f.text}">`:(portable074()?missing074():btn(tr('Получить фотографию с сервера','Fetch photograph via server'),`downloadPhoto073(${i})`,'primary'))}<p>${esc(a[3])}</p><small>${esc(a[5])}</small></div>`}).join('')}</div></section>`}
async function downloadPhoto073(i){let a=photos073[i],st=$('photoStatus073');if(st)st.textContent=tr('Загрузка фотографии…','Downloading photograph…');try{let blob=await fetchAsset073(a[4],a[0]),bytes=new Uint8Array(await blob.arrayBuffer());if(bytes[0]!==255||bytes[1]!==216||blob.size>8*1024*1024)throw Error('Invalid JPEG');let uri=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(new Blob([bytes],{type:'image/jpeg'}))});let row={id:a[0],kind:'photo',name:a[1],meta:a[3],source:a[5],size:blob.size,text:uri};try{await op07('readwrite',x=>x.put(row));await refresh07()}catch{row.sessionOnly=true;files07=files07.filter(x=>x.id!==row.id).concat(row)}render();$('photoStatus073').textContent=row.sessionOnly?tr('Только текущий сеанс','Current session only'):tr('Фотография сохранена на устройстве','Photograph saved on device')}catch(e){if(st)st.textContent=tr('Не удалось загрузить фотографию: ','Photo download failed: ')+e.message}}

function missing074(){return `<div class="tag" style="color:var(--muted)">${tr('ОРИГИНАЛ НЕ ВСТРОЕН','ORIGINAL NOT BUNDLED')}</div><p>${tr('В этой сборке прочитать полный оригинал нельзя. Повторная попытка подключения не требуется.','This build does not contain the full original. No retry is needed.')}</p>`}
const packaged074=[]; // CONTENT_PACK_074
function loadPack074(){for(let a of packaged074){try{let row={id:a.id,kind:a.kind,name:a.name,meta:a.meta,source:a.source,ext:a.ext,size:a.size,sessionOnly:true};if(a.kind==='photo'){row.text='data:image/jpeg;base64,'+a.data;}else if(a.ext==='xml'){let xml=new TextDecoder().decode(Uint8Array.from(atob(a.data),c=>c.charCodeAt(0))),d=parseArticle073(xml);row.name=d.title;row.meta=d.authors+' · '+d.journal+' · '+d.license;row.ext='txt';row.text=d.text;row.file=new Blob([d.text],{type:'text/plain'});row.size=row.file.size;}else{let bytes=Uint8Array.from(atob(a.data),c=>c.charCodeAt(0));if(a.ext==='pdf'&&new TextDecoder().decode(bytes.slice(0,5))!=='%PDF-')continue;row.file=new Blob([bytes],{type:a.ext==='pdf'?'application/pdf':'text/plain'});row.text=a.ext==='txt'?new TextDecoder().decode(bytes):''}if(!files07.some(f=>f.id===row.id))files07.push(row)}catch(e){console.warn('Invalid bundled asset',a.id)}}}
function statusPanel074(){let n=files07.filter(f=>f.kind==='book').length;return `<div class="panel" id="statusPanel074"><div class="tag">${tr('СОСТОЯНИЕ БИБЛИОТЕКИ','LIBRARY STATUS')}</div><p>${tr('Полные сохранённые оригиналы: ','Saved originals: ')}<b>${n}</b> · ${tr('Встроенные авторские материалы: ','Built-in editorial readings: ')}<b>${modules072.length}</b></p><p>${tr('Оригинал книги и авторское пояснение — разные материалы. В каталоге отсутствующие файлы помечены отдельно. Для чтения встроенных пояснений сеть не требуется.','Original books and editorial explanations are separate. Missing files are marked explicitly. Built-in study readings work offline.')}</p></div>`}
